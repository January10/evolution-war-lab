name: Pixel Frontline - manual QA only (ChatGPT owns development)

# Development is performed by ChatGPT's hourly task, NOT by GitHub Copilot,
# Codex CLI, an API coding agent or a GitHub Actions schedule.
# Manual verification remains available; regular push/PR CI runs on the
# development branch through .github/workflows/ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify current development branch (no code changes)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai/evolution-war-lab-autodev
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests, build, simulated long-run diagnostics
        run: |
          npm test
          npm run build
          npm run soak
          npm run difficulty
      - name: Install Chromium for actual HTML browser playtest
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Browser input playtest of built HTML
        run: |
          python scripts/autodev_playtest.py
          python scripts/browser_soak.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-browser-evidence
          path: qa-output/
          if-no-files-found: warn
          retention-days: 7
