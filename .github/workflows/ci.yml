name: Test, build and browser playtest
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm test
      - run: npm run build
      - run: npm run soak
      - run: npm run difficulty
      - name: Install Chromium for real HTML playtest
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Actual wall-clock input test (24 seconds) and accelerated long-loop test
        run: |
          python scripts/autodev_playtest.py
          python scripts/browser_soak.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-playtest-evidence
          path: qa-output/
          if-no-files-found: warn
          retention-days: 7
